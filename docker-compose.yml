services:
  db:
    image: postgres:16-alpine
    container_name: deskbooking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      internal:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Kein Port-Mapping nach aussen - Datenbank ist nur im internen Netz erreichbar

  backend:
    build: ./backend
    container_name: deskbooking-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Feste IP statt Hostname "db": umgeht DNS-Aufloesung fuer diese
      # Verbindung vollstaendig. Muss zur ipv4_address oben passen.
      POSTGRES_HOST: 172.28.0.10
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    # Kein Port-Mapping nach aussen - nur ueber das Frontend (Next.js Rewrite) erreichbar

  frontend:
    build: ./frontend
    container_name: deskbooking-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      # Docker setzt HOSTNAME automatisch auf die Container-ID. Next.js bindet
      # sich im Standalone-Modus genau daran - und lauscht dann NUR auf der IP
      # des ersten Netzwerks. Da der Container in zwei Netzwerken haengt
      # (internal + webnet), koennte Caddy ihn sonst nicht erreichen
      # ("connection refused"). 0.0.0.0 = auf allen Interfaces lauschen.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - backend
    networks:
      - internal
      - webnet
    security_opt:
      - no-new-privileges:true
    # Kein Port-Mapping nach aussen - dein bestehender Caddy erreicht den Container
    # ueber "webnet" direkt unter dem Namen "deskbooking-frontend:3000".

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Bereits vorhandenes externes Netzwerk, in dem dein Caddy laeuft (wie bei Toolbox).
  webnet:
    external: true

volumes:
  db_data:
